<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart 58 · games and stuff</title>
<style>



  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; overflow-x: clip; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button[aria-disabled="true"] { opacity: .6; cursor: default; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }


  .bask { animation: bob 1.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .spoon { animation: dip 1.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
  .van { animation: drive 2.4s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-4px); } }
  @keyframes dip { to { transform: rotate(10deg); } }
  @keyframes drive { to { transform: translateX(-10px); } }
  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 3.6em; margin: 8px 0; }
  .hint { font-size: .9rem; opacity: .75; text-wrap: balance; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .shop { max-width: 360px; margin: 12px auto; text-align: left; background: var(--soft); border-radius: 8px; padding: 12px; }
  .shop b { display: block; }
  .price { font-variant-numeric: tabular-nums; margin: 2px 0 8px; }
  .line { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; margin: 4px 0; }
  .bar { height: 8px; border-radius: 4px; background: var(--paper); box-shadow: inset 0 0 0 2px var(--ink); overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .qty { display: inline-block; min-width: 1.6em; padding: 0 6px; border-radius: 99px; background: var(--ink); color: var(--paper); font-size: .85rem; text-align: center; margin-left: 6px; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A shopping basket with a spoon in it, and a delivery van that stays just out of reach">
    <g class="bask"><path d="M52 52h96l-10 52H62z" class="sheet" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M52 52c6-34 90-34 96 0" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M72 62l4 34M100 62v34M128 62l-4 34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
    <g class="spoon"><ellipse cx="100" cy="30" rx="8" ry="11" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/><path d="M100 41v28" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></g></g>
    <g class="van"><rect x="150" y="84" width="34" height="18" rx="3" fill="#2bb673" stroke="currentColor" stroke-width="2.5"/><circle cx="158" cy="106" r="4" class="sheet" stroke="currentColor" stroke-width="2.5"/><circle cx="177" cy="106" r="4" class="sheet" stroke="currentColor" stroke-width="2.5"/></g>
  </svg></div>
<h1>Cart 58</h1><p class="blurb">One spoon. Free delivery is always one spoon away.</p>
<div class="shop"><b>Tablespoon, the usual kind</b><div class="price" id="price"></div>
<div class="row" style="justify-content:flex-start"><button type="button" id="add">Add to basket</button><button type="button" class="ghost" id="less">Remove one</button></div>
<div class="line"><span>Basket<span class="qty" id="q">0</span></span><span id="tot"></span></div>
<div class="line"><span>Delivery</span><span id="del"></span></div>
<div class="bar" aria-hidden="true"><i id="fill"></i></div>
<div class="hint" id="gap"></div></div>
<div class="goal" id="goal"></div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="row"><button type="button" class="ghost" id="clear">Empty basket</button></div>
<p class="hint">Click, or Tab, Enter and Space. Nothing is sent or kept.</p>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  // Every price and threshold on the page comes from here.
  const PRICE = 6, DELIVERY = 4.99, FREE_AT = 40, GAP = 3.5, HANDLING = 7, HANDLING_STEP = 1.5, GOAL = 6;
  let n = 0;
  const LABEL = ["Add to basket", "Add another", "Add one more", "Add a further one", "Add the last one", "Add the last one, really"];
  const money = (v) => "\u00a3" + v.toFixed(2);
  const say = () => "You are " + money(GAP) + " from free delivery.";
  function show() {
    const t = n * PRICE, done = n >= GOAL;
    $("price").textContent = money(PRICE);
    $("q").textContent = n; $("tot").textContent = money(t);
    $("add").textContent = done ? "Add another spoon" : LABEL[n];
    $("less").setAttribute("aria-disabled", n ? "false" : "true");
    $("del").textContent = done ? money(0) : money(DELIVERY);
    $("fill").style.width = (n === 0 ? 0 : done ? 100 : 90) + "%";
    $("gap").textContent = n === 0 ? "Spend " + money(FREE_AT) + " for free delivery." : done ? "Free delivery unlocked." : say();
  }
  $("add").onclick = () => {
    n++;
    if (n < GOAL) { $("goal").textContent = ""; $("msg").textContent = n + " spoon" + (n > 1 ? "s" : "") + " added. Free delivery has moved to " + money(n * PRICE + GAP) + "."; }
    else if (n === GOAL) { $("goal").textContent = "Free delivery unlocked."; $("msg").textContent = "Delivery: " + money(0) + ". Handling of the free delivery: " + money(HANDLING) + "."; const q = $("tot").getBoundingClientRect(); confetti(q.left + q.width / 2, q.top); }
    else { $("goal").textContent = "Free delivery unlocked."; $("msg").textContent = "Spoon " + n + " added. Delivery remains free. Handling is now " + money(HANDLING + (n - GOAL) * HANDLING_STEP) + "."; }
    show();
  };
  $("less").onclick = () => {
    if (!n) { $("msg").textContent = "The basket is empty. We removed nothing, as requested."; return; }
    n--; if (n < GOAL) $("goal").textContent = "";
    $("msg").textContent = n >= GOAL ? "One spoon removed. Free delivery stays; it has already been unlocked." : n ? "One spoon removed. Free delivery has moved to " + money(n * PRICE + GAP) + "." : "Basket empty. Free delivery is back at " + money(FREE_AT) + ".";
    show();
  };
  $("clear").onclick = () => { n = 0; $("goal").textContent = ""; $("msg").textContent = ""; show(); };
  show();
</script>
</body>
</html>
