<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bell 55 · games and stuff</title>
<style>

  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; overflow-x: clip; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button[aria-disabled="true"] { opacity: .6; cursor: default; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .c1 { animation: crumb 2.2s ease-in-out infinite; }
  .c2 { animation: crumb 2.2s ease-in-out .5s infinite; }
  .c3 { animation: crumb 2.2s ease-in-out 1s infinite; }
  .peck { animation: peck 1.6s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse, .c1, .c2, .c3, .peck { transform-box: fill-box; transform-origin: center; }
  @keyframes crumb { 50% { transform: translateY(-3px) scale(.85); } }
  @keyframes peck { 50% { transform: rotate(-12deg) translateY(2px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .hero .body { fill: var(--wall); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .ring { animation: ring 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
  @keyframes ring { 0%, 60%, 100% { transform: rotate(0); } 10% { transform: rotate(10deg); } 20% { transform: rotate(-9deg); } 30% { transform: rotate(6deg); } 40% { transform: rotate(-4deg); } }
  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 3.6em; }
  .hint { font-size: .9rem; opacity: .75; text-wrap: balance; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .head { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; margin: 16px 0 8px; }
  .badge { min-width: 1.6em; height: 1.6em; padding: 0 .3em; box-sizing: border-box; border-radius: 1em; background: #d93025; color: #fff; font-size: .9rem; display: inline-flex; align-items: center; justify-content: center; }
  .badge[hidden] { display: none; }
  ul.list { list-style: none; padding: 0; margin: 0 auto; max-width: 400px; text-align: left; }
  ul.list li { background: var(--soft); border-radius: 8px; padding: 10px 12px; margin: 6px 0; overflow-wrap: anywhere; border-left: 6px solid #d93025; }
  ul.list li.read { border-left-color: transparent; opacity: .65; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A bell swinging, with a red alert badge beside it">
    <g class="ring"><path class="body" d="M100 14c-22 0-34 18-34 40v20l-12 14h92l-12-14V54c0-22-12-40-34-40z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M88 94a12 12 0 0 0 24 0" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/></g>
    <g class="pulse"><circle cx="134" cy="26" r="13" fill="#d93025" stroke="currentColor" stroke-width="2"/><path d="M134 19v9" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="134" cy="33" r="1.8" fill="#fff"/></g>
    <path d="M10 112h180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Bell 55</h1><p class="blurb">Mark all as read. It will make a note.</p>
<div class="goal" id="goal"></div>
<div class="head"><span>Notifications</span><span class="badge" id="badge" role="status" aria-live="polite"></span></div>
<ul class="list" id="list"></ul>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="row"><button type="button" id="act">Mark all as read</button></div>
<p class="hint">Click, or Tab, Enter and Space. Nothing is sent or kept.</p>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  // Marking everything as read is itself news. Turning notifications off is the way out (the fourth press).
  let items, n, done;
  function paint() {
    const u = items.filter((i) => !i.read).length;
    $("badge").hidden = u === 0;
    $("badge").textContent = u;
    $("badge").setAttribute("aria-label", u + " unread");
    const ul = $("list"); ul.textContent = "";
    items.forEach((i) => {
      const li = document.createElement("li");
      li.textContent = i.t; if (i.read) li.className = "read";
      ul.appendChild(li);
    });
    $("act").textContent = n >= 3 ? "Turn off notifications" : "Mark all as read";
    $("act").setAttribute("aria-disabled", String(!!done));
  }
  const plural = (k) => k + (k === 1 ? " notification" : " notifications");
  // m = how many were just marked read, counted from the list, not typed in.
  const NEWS = [
    (m) => [`You marked ${plural(m)} as read.`, "Marked. We have let you know."],
    (m) => [`You marked ${plural(m)} as read. Well done.`, "One new notification, about the last one."],
    (m) => [`You have ${plural(m)} about your notifications. Manage them in Settings.`, "Settings is the next button."]
  ];
  $("act").onclick = () => {
    if (done) return;
    if (n >= 3) {
      done = true;
      items.forEach((i) => (i.read = true));
      items.unshift({ t: "Notifications are off. We have emailed you to confirm.", read: true });
      $("goal").textContent = "Nothing new.";
      $("msg").textContent = "Notifications are off. You have one email.";
      paint();
      return;
    }
    const m = items.filter((i) => !i.read).length;
    items.forEach((i) => (i.read = true));
    const [t, msg] = NEWS[n](m);
    items.unshift({ t, read: false });
    $("goal").textContent = "All read.";
    $("msg").textContent = msg;
    n++;
    paint();
  };
  function start() {
    done = false; n = 0;
    items = [{ t: "Someone liked something.", read: false }, { t: "Your 4 day streak is at risk.", read: false }, { t: "A reminder that you have notifications.", read: false }];
    $("goal").textContent = ""; $("msg").textContent = "";
    paint();
  }
  $("reset").onclick = start;
  start();
</script>
</body>
</html>
