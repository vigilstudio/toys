<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code 56 · games and stuff</title>
<style>


  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; --panel: #b9c2cf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; --panel: #3c4655; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; overflow-x: clip; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button[aria-disabled="true"] { opacity: .6; cursor: default; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .bob { animation: bob 2.4s ease-in-out infinite; }
  .roll { animation: roll 3s ease-in-out infinite alternate; }
  .wobble { animation: wobble 2.6s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  .c1 { animation: crumb 2.2s ease-in-out infinite; }
  .c2 { animation: crumb 2.2s ease-in-out .5s infinite; }
  .c3 { animation: crumb 2.2s ease-in-out 1s infinite; }
  .peck { animation: peck 1.6s ease-in-out infinite; }
  .bob, .roll, .wobble, .pulse, .c1, .c2, .c3, .peck { transform-box: fill-box; transform-origin: center; }
  @keyframes crumb { 50% { transform: translateY(-3px) scale(.85); } }
  @keyframes peck { 50% { transform: rotate(-12deg) translateY(2px); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes roll { to { transform: translateX(18px); } }
  @keyframes wobble { 50% { transform: scale(.94, 1.04); } }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .hero .body { fill: var(--wall); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  .nod { animation: nod 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes nod { 50% { transform: translateY(-4px) rotate(-3deg); } }
  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 3.6em; }
  .hint { font-size: .9rem; opacity: .75; text-wrap: balance; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .sms { max-width: 340px; margin: 12px auto; text-align: left; background: var(--wall); border-radius: 14px 14px 14px 2px; padding: 10px 14px; overflow-wrap: anywhere; }
  .sms b { letter-spacing: .2em; font-variant-numeric: tabular-nums; }
  .boxes { display: flex; justify-content: center; gap: 8px; margin: 16px 0 8px; }
  .boxes input { width: 44px; max-width: 13vw; height: 56px; box-sizing: border-box; text-align: center; font: inherit; font-size: 1.6rem; font-weight: 700; color: var(--ink); background: var(--soft); border: 0; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--ink); padding: 0; }
  .boxes input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .boxes input.no { animation: shake .35s; box-shadow: inset 0 0 0 3px #d93025; }
  .boxes input.ok { box-shadow: inset 0 0 0 3px #2bb673; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; max-width: 300px; margin: 8px auto; }
  .pad button { margin: 0; padding: 10px 0; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A phone showing a text message with a row of dots, a small padlock nodding beside it">
    <rect x="70" y="8" width="60" height="100" rx="9" class="body" stroke="currentColor" stroke-width="2.5"/>
    <rect x="80" y="26" width="40" height="22" rx="5" class="sheet" stroke="currentColor" stroke-width="2"/>
    <path d="M86 37h28" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
    <path d="M100 98h0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <g class="nod"><rect x="142" y="52" width="24" height="20" rx="4" fill="#ffb020" stroke="currentColor" stroke-width="2.5"/><path d="M147 52v-6a7 7 0 0 1 14 0v6" fill="none" stroke="currentColor" stroke-width="2.5"/></g>
    <path d="M10 112h180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </svg></div>
<h1>Code 56</h1><p class="blurb">We sent you a code. Do not share it with us.</p>
<div class="sms">Your verification code is <b id="shown"></b>. Never share this code with anyone.</div>
<div class="goal" id="goal"></div>
<div class="boxes" id="boxes" role="group" aria-label="Verification code, six digits"></div>
<div class="pad" id="pad"></div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<p class="hint">Click the keys, or type, with Backspace and arrows. Nothing is sent or kept.</p>
<div class="row"><button type="button" class="ghost" id="reset">Start again</button></div>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled || b.getAttribute("aria-disabled") === "true") return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  // The code was sent and must not be shared, so a digit that matches it is refused. Six wrong digits are the way in.
  const CODE = "381407";
  $("shown").textContent = CODE.split("").join(" ");
  const REFUSE = ["That digit is the code. It is not to be shared.", "Not that one. We sent it to you in confidence.", "That is part of the code. Please keep it to yourself."];
  let done, r = 0, bx = [];
  const boxes = $("boxes");
  for (let i = 0; i < CODE.length; i++) {
    const t = document.createElement("input");
    t.type = "text"; t.inputMode = "numeric"; t.maxLength = 1; t.autocomplete = "off";
    t.setAttribute("aria-label", "Digit " + (i + 1) + " of " + CODE.length);
    t.onkeydown = (e) => {
      if (done || e.ctrlKey || e.metaKey || e.altKey) return;
      if (/^\d$/.test(e.key)) { e.preventDefault(); put(i, e.key); }
      else if (e.key === "Backspace") { e.preventDefault(); if (t.value) { t.value = ""; mark(i); } else if (i > 0) { bx[i - 1].value = ""; mark(i - 1); bx[i - 1].focus(); } }
      else if (e.key === "ArrowLeft" && i > 0) { e.preventDefault(); bx[i - 1].focus(); }
      else if (e.key === "ArrowRight" && i < CODE.length - 1) { e.preventDefault(); bx[i + 1].focus(); }
      else if (e.key.length === 1) e.preventDefault();
    };
    t.oninput = () => { t.value = ""; };
    t.onfocus = () => { cur = i; };
    boxes.appendChild(t); bx.push(t);
  }
  let cur = 0;
  function mark(i) { bx[i].className = ""; }
  function put(i, d) {
    if (done) return;
    const t = bx[i];
    t.classList.remove("no");
    if (d === CODE[i]) {
      void t.offsetWidth; t.value = ""; t.className = "no";
      $("goal").textContent = "Refused.";
      $("msg").textContent = REFUSE[r++ % REFUSE.length];
      t.focus();
      return;
    }
    t.value = d; t.className = "";
    $("goal").textContent = ""; $("msg").textContent = "";
    if (bx.every((b) => b.value)) {
      done = true;
      bx.forEach((b) => { b.className = "ok"; b.readOnly = true; });
      $("goal").textContent = "Verified.";
      $("msg").textContent = "You are the only one who does not know the code. Welcome.";
      const q = boxes.getBoundingClientRect();
      confetti(q.left + q.width / 2, q.top);
      return;
    }
    const nx = bx.findIndex((b, k) => k > i && !b.value);
    const to = nx >= 0 ? nx : bx.findIndex((b) => !b.value);
    bx[to].focus();
  }
  const pad = $("pad");
  [..."1234567890"].forEach((d) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = d;
    b.setAttribute("aria-label", "Digit " + d);
    b.onclick = () => put(Math.max(0, bx.findIndex((x) => !x.value)) , d);
    pad.appendChild(b);
  });
  function start() {
    done = false; r = 0;
    bx.forEach((b) => { b.value = ""; b.className = ""; b.readOnly = false; });
    $("goal").textContent = ""; $("msg").textContent = "";
  }
  $("reset").onclick = () => { start(); bx[0].focus(); };
  start();
</script>
</body>
</html>
