<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share 61 · games and stuff</title>
<style>



  :root { --ink: #111; --paper: #fff; --accent: #1a6ef0; --on-accent: #fff; --soft: #e7e7e7; --wall: #dfe8f5; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; }
  }
  :root[data-theme="dark"] { --ink: #eee; --paper: #161616; --accent: #6aa8ff; --on-accent: #111; --soft: #262626; --wall: #26303d; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Roboto, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; text-align: center; overflow-x: clip; }
  h1 { font-size: 2rem; margin: 24px 0 4px; }
  .blurb { opacity: .75; margin: 0 0 24px; }
  button { font: inherit; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; margin: 4px; }
  button:disabled, button[aria-disabled="true"] { opacity: .6; cursor: default; }
  button.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  .big { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 16px 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .card { background: var(--soft); border-radius: 8px; padding: 12px; margin: 8px 0; }
  a.back { display: inline-block; margin-top: 32px; color: var(--accent); }
  canvas { max-width: 100%; background: var(--soft); border-radius: 8px; touch-action: none; }
  select { font: inherit; padding: 8px; max-width: 100%; }

  .hero { margin: 8px auto 0; max-width: 260px; }
  .hero svg { width: 100%; height: auto; color: var(--ink); }
  .hero .sheet { fill: var(--paper); }
  .confetti { position: fixed; width: 8px; height: 8px; border-radius: 2px; pointer-events: none; animation: pop .9s ease-out forwards; z-index: 9; }
  @keyframes pop { to { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }


  .arrow { animation: up 1.4s ease-in-out infinite; }
  .f1, .f2, .f3 { transform-box: fill-box; transform-origin: center; animation: pop2 2.4s ease-in-out infinite; }
  .f2 { animation-delay: .3s; } .f3 { animation-delay: .6s; }
  @keyframes up { 50% { transform: translateY(-4px); } }
  @keyframes pop2 { 50% { transform: scale(1.2); } }
  .goal { min-height: 1.6em; font-weight: 700; }
  .msg { min-height: 3.6em; margin: 8px 0; }
  .hint { font-size: .9rem; opacity: .75; text-wrap: balance; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .sheet2 { background: var(--soft); border-radius: 14px; padding: 12px; margin: 12px auto; max-width: 360px; }
  .photo { display: flex; align-items: center; gap: 10px; text-align: left; margin-bottom: 8px; }
  .photo svg { width: 64px; height: 44px; flex: none; border-radius: 6px; }
  .targets { display: grid; gap: 8px; }
  .targets button { margin: 0; text-align: left; }
  .reach { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main id="page">
<div class="hero"><svg viewBox="0 0 200 120" role="img" aria-label="A photo with a share arrow, and a row of small faces that keeps getting longer">
    <rect x="70" y="14" width="60" height="44" rx="5" fill="#dfe8f5" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="90" cy="34" r="8" fill="#ffb020" stroke="currentColor" stroke-width="2"/><path d="M78 52l14-12 10 8 8-6 12 10z" fill="#2bb673" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path class="arrow" d="M100 64v10M95 69l5-5 5 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="f1"><circle cx="100" cy="92" r="7" fill="#ff5c8a" stroke="currentColor" stroke-width="2"/></g>
    <g class="f2"><circle cx="80" cy="102" r="7" fill="#1a6ef0" stroke="currentColor" stroke-width="2"/><circle cx="120" cy="102" r="7" fill="#ffb020" stroke="currentColor" stroke-width="2"/></g>
    <g class="f3"><circle cx="58" cy="110" r="6" fill="#2bb673" stroke="currentColor" stroke-width="2"/><circle cx="100" cy="112" r="6" fill="#ff5c8a" stroke="currentColor" stroke-width="2"/><circle cx="142" cy="110" r="6" fill="#1a6ef0" stroke="currentColor" stroke-width="2"/></g>
  </svg></div>
<h1>Share 61</h1><p class="blurb">One photo. One person.</p>
<div class="sheet2">
  <div class="photo"><svg viewBox="0 0 64 44" aria-hidden="true"><rect width="64" height="44" fill="#dfe8f5"/><circle cx="20" cy="16" r="7" fill="#ffb020"/><path d="M0 44l20-18 14 10 10-8 20 16z" fill="#2bb673"/></svg><div><b>IMG_0412</b><div class="reach">Seen by <b id="n">0</b></div></div></div>
  <div class="targets">
    <button type="button" id="mum">Mum</button>
    <button type="button" id="grp">Family</button>
    <button type="button" id="lnk">Copy link</button>
  </div>
</div>
<div class="goal" id="goal">Send it to one person.</div>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<div class="row"><button type="button" id="done">Done</button><button type="button" class="ghost" id="reset">Start over</button></div>
<p class="hint">Nothing is sent or kept.</p>
<a class="back" href="../../">&larr; all games and stuff</a>
</main>
<script>
  const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function confetti(x, y) {
    if (calm()) return;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.style.left = x + "px";
      s.style.top = y + "px";
      s.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
      s.style.background = ["#1a6ef0", "#ffb020", "#ff5c8a", "#2bb673"][i % 4];
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    confetti(e.detail ? e.clientX : r.left + r.width / 2, e.detail ? e.clientY : r.top + r.height / 2);
  });

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("en-GB");
  const lines = ["Sent to Mum. Just Mum.", "Mum sent it to Auntie Jan.", "Auntie Jan sent it to her book club.", "The book club sent it to the parish newsletter.", "The newsletter has a website.", "The website has a mailing list."];
  const FAMILY = 47, FAMILY_FORWARDS = 9, MUM_FORWARDS = 3, BOSS_LIMIT = 500;
  $("grp").textContent = "Family (" + FAMILY + ")";
  let n = 0, steps = 0, over = false;
  const note = (t) => { $("msg").textContent = t; };
  function pick(mult, first, line) {
    if (over) return;
    n = n === 0 ? first : n * mult; steps++;
    $("n").textContent = fmt(n);
    note(line);
    if (n > BOSS_LIMIT) end("Seen by " + fmt(n) + ". One of them is your boss.");
  }
  function end(t) {
    over = true; note(t); $("goal").textContent = "Shared.";
    for (const id of ["mum", "grp", "lnk"]) $(id).disabled = true;
  }
  $("mum").onclick = () => pick(MUM_FORWARDS, 1, lines[Math.min(steps, lines.length - 1)]);
  $("grp").onclick = () => pick(FAMILY_FORWARDS, FAMILY, "Family forwarded it to their families.");
  $("lnk").onclick = () => { if (over) return; n = 1000000; $("n").textContent = fmt(n); end("Link copied. Seen by anyone with the link. That is anyone."); };
  $("done").onclick = () => {
    if (over) return;
    if (n === 0) note("Nothing shared. The photo is very pleased.");
    else if (n === 1) end("Seen by " + fmt(n) + ". Just Mum, as asked.");
    else end("Done. Seen by " + fmt(n) + ". You asked for one.");
  };
  $("reset").onclick = () => { n = 0; steps = 0; over = false; $("n").textContent = "0"; note(""); $("goal").textContent = "Send it to one person.";
    for (const id of ["mum", "grp", "lnk"]) $(id).disabled = false; };
</script>
</body>
</html>
